<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2563eb">

<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171c;--mu:#6b7280;--bd:#e5e7eb;--in:#16a34a;--out:#dc2626;--sv:#2563eb;--ac:#2563eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#f1f3f6;--mu:#9aa3b2;--bd:#2a2f3a;--in:#4ade80;--out:#f87171;--sv:#60a5fa;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#f1f3f6;--mu:#9aa3b2;--bd:#2a2f3a;--in:#4ade80;--out:#f87171;--sv:#60a5fa;--ac:#60a5fa}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
.w{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}
.sel{display:flex;gap:8px;margin-bottom:12px}
select,input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:16px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.c.big{grid-column:span 2}
.c small{color:var(--mu);display:block;font-size:13px}
.c b{font-size:22px}
.in{color:var(--in)}.out{color:var(--out)}.sv{color:var(--sv)}
h2{font-size:16px;margin:16px 4px 8px;color:var(--mu);font-weight:600}
.row{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row .n{font-size:13px;color:var(--mu)}
.row button{background:none;border:0;color:var(--mu);font-size:20px;padding:4px 8px}
.mrow{display:grid;grid-template-columns:42px 1fr 1fr 1fr;gap:4px;font-size:14px;padding:8px 10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:6px;align-items:center}
.mrow.h{background:none;border:0;color:var(--mu);font-size:12px}
.mrow span:not(:first-child){text-align:right}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border:0;border-radius:30px;padding:14px 22px;font-size:17px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.sheet.on{display:flex}
.box{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.box label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg button{padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.tg button.a{background:var(--ac);color:#fff;border-color:var(--ac)}
.save{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:17px;font-weight:600}
.cancel{width:100%;margin-top:6px;padding:10px;border:0;background:none;color:var(--mu);font-size:16px}
.empty{text-align:center;color:var(--mu);padding:20px}
.tools{display:flex;gap:8px;margin-top:18px}
.tools button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font-size:14px}
.pb{height:10px;background:var(--bd);border-radius:6px;margin:8px 0;overflow:hidden}.pb i{display:block;height:100%;background:var(--sv);border-radius:6px}
.lk{width:100%;margin-bottom:12px;padding:10px;border-radius:12px;border:1px dashed var(--bd);background:none;color:var(--ac);font-size:15px}
.bi{fill:var(--in)}.bo{fill:var(--out)}.bt{fill:var(--mu);font-size:9px}
.lg{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 0}.lg i{width:10px;height:10px;border-radius:3px;flex:none}.lg span{flex:1}
</style>
</head>
<body>
<div class="w">
<h1>💰 Mis Finanzas</h1>
<div class="sel"><select id="y"></select><select id="m"></select></div>
<div class="cards" id="cards"></div>
<div id="goal"></div><div id="ch"></div><div id="yr"></div>
<h2 id="lt">Movimientos</h2>
<div id="list"></div>
<div class="tools"><button id="ex">Copia de seguridad</button><button id="im">Restaurar</button></div>
<input type="file" id="fi" accept=".json" hidden>
</div>
<button class="fab" id="add">+ Añadir</button>

<div class="sheet" id="sh"><div class="box">
<div class="tg"><button id="t1" class="a">Ingreso</button><button id="t2">Gasto</button></div>
<label>Cantidad (€)</label><input id="am" type="number" inputmode="decimal" step="0.01" placeholder="0,00">
<label>Categoría</label><select id="ct"></select>
<label>Fecha</label><input id="dt" type="date">
<label>Nota (opcional)</label><input id="nt" type="text" placeholder="Ej: nómina, supermercado…">
<button class="save" id="sv">Guardar</button>
<button class="cancel" id="cc">Cancelar</button>
</div></div>

<div class="sheet" id="gs"><div class="box"><b>🎯 Metas de ahorro</b>
<label>Meta mensual (€), vale para todos los meses</label><input id="gm" type="number" inputmode="decimal" placeholder="Ej: 200">
<label>Meta anual <span id="gl"></span> (€), si lo dejas vacío será la mensual × 12</label><input id="gy" type="number" inputmode="decimal" placeholder="Ej: 2400">
<button class="save" id="gv">Guardar meta</button><button class="cancel" id="gc">Cancelar</button></div></div>
<script>
var KEY="mis-finanzas-v1",MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
var CI=["Nómina","Extra","Otros ingresos"],CG=["Vivienda","Comida","Transporte","Ocio","Salud","Facturas","Ropa","Otros gastos"];
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
var CAT=ld("mf-cats",{"in":CI,"out":CG}),GO=ld("mf-goals",{m:0,y:{}}),COL=["#2563eb","#dc2626","#16a34a","#f59e0b","#8b5cf6","#06b6d4","#ec4899","#84cc16","#f97316","#64748b"];
function sv2(){try{localStorage.setItem("mf-cats",JSON.stringify(CAT));localStorage.setItem("mf-goals",JSON.stringify(GO))}catch(e){}}
function donut(cs,ck,g){if(!ck.length||!g)return"";var C=251.33,o=0,s="",lg="";ck.forEach(function(c,i){var l=cs[c]/g*C,col=COL[i%COL.length];s+='<circle cx="50" cy="50" r="40" fill="none" stroke="'+col+'" stroke-width="16" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-o)+'" transform="rotate(-90 50 50)"/>';o+=l;lg+='<div class="lg"><i style="background:'+col+'"></i><span>'+esc(c)+'</span><b>'+eur(cs[c])+' · '+Math.round(cs[c]/g*100)+'%</b></div>'});return'<h2>Gastos por categoría</h2><div class="c"><svg viewBox="0 0 100 100" style="width:150px;display:block;margin:0 auto 10px">'+s+'</svg>'+lg+'</div>'}
function extra(ya,s){
 var t=M?GO.m:(GO.y[Y]||(GO.m?GO.m*12:0)),lb=M?"mensual":"anual "+Y,h="";
 if(t>0){var p=Math.max(0,Math.min(100,Math.round(s/t*100)));h='<div class="c" style="margin-bottom:10px"><small>🎯 Meta '+lb+': '+eur(t)+'</small><div class="pb"><i style="width:'+p+'%"></i></div><small>'+(s>=t?"¡Meta cumplida! 🎉":"Llevas el "+p+"% · te faltan "+eur(t-s))+'</small></div>'}
 $("goal").innerHTML=h+'<button class="lk">🎯 '+(t>0?"Cambiar":"Fijar")+' meta de ahorro</button>';
 var c="";
 if(!M){var mx=1,b=[];for(var k=1;k<=12;k++){var a=ya.filter(function(x){return +x.date.slice(5,7)===k});b.push([sum(a,"in"),sum(a,"out")]);mx=Math.max(mx,b[k-1][0],b[k-1][1])}
  c='<h2>Ingresos y gastos por mes</h2><div class="c"><svg viewBox="0 0 336 130" style="width:100%">';
  b.forEach(function(v,k){var x=6+k*27.5,h1=v[0]/mx*95,h2=v[1]/mx*95;c+='<rect class="bi" x="'+x+'" y="'+(105-h1)+'" width="11" height="'+h1+'" rx="2"/><rect class="bo" x="'+(x+12)+'" y="'+(105-h2)+'" width="11" height="'+h2+'" rx="2"/><text class="bt" x="'+(x+11.5)+'" y="120" text-anchor="middle">'+MES[k].slice(0,1)+'</text>'});
  c+='</svg><small><span class="in">■</span> Ingresos &nbsp; <span class="out">■</span> Gastos</small></div>'}
 $("ch").innerHTML=c}
function openGoal(e){if(e.target.className!=="lk")return;$("gm").value=GO.m||"";$("gy").value=GO.y[Y]||"";$("gl").textContent=Y;$("gs").className="sheet on"}
$("goal").onclick=openGoal;
$("gc").onclick=function(){$("gs").className="sheet"};
$("gv").onclick=function(){var m=parseFloat(String($("gm").value).replace(",","."))||0,y=parseFloat(String($("gy").value).replace(",","."))||0;GO.m=m;if(y>0)GO.y[Y]=y;else delete GO.y[Y];sv2();$("gs").className="sheet";render()};
$("ct").onchange=function(){if(this.value==="__new"){var n=(prompt("Nombre de la nueva categoría")||"").trim();if(n&&CAT[type].indexOf(n)<0){CAT[type].push(n);sv2()}cats();if(n)this.value=n}};
var tx=[],type="in",now=new Date(),Y=now.getFullYear(),M=now.getMonth()+1;
try{tx=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){tx=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tx))}catch(e){}}
function $(i){return document.getElementById(i)}
function eur(n){return n.toLocaleString("es-ES",{style:"currency",currency:"EUR"})}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sum(a,t){return a.filter(function(x){return x.type===t}).reduce(function(s,x){return s+x.amount},0)}
function fillSel(){
 var ys={};ys[now.getFullYear()]=1;ys[Y]=1;ys[now.getFullYear()+1]=1;tx.forEach(function(x){ys[+x.date.slice(0,4)]=1});
 $("y").innerHTML=Object.keys(ys).sort().reverse().map(function(y){return'<option'+(+y===Y?' selected':'')+'>'+y+'</option>'}).join("");
 $("m").innerHTML='<option value="0"'+(M===0?' selected':'')+'>Todo el año</option>'+MES.map(function(n,i){return'<option value="'+(i+1)+'"'+(M===i+1?' selected':'')+'>'+n+'</option>'}).join("");
}
function render(){
 var ya=tx.filter(function(x){return +x.date.slice(0,4)===Y});
 var ma=M?ya.filter(function(x){return +x.date.slice(5,7)===M}):ya;
 var i=sum(ma,"in"),g=sum(ma,"out"),s=i-g;
 $("cards").innerHTML='<div class="c"><small>Ingresos</small><b class="in">'+eur(i)+'</b></div><div class="c"><small>Gastos</small><b class="out">'+eur(g)+'</b></div><div class="c big"><small>Ahorro '+(M?MES[M-1]:"del año")+' '+Y+'</small><b class="sv">'+eur(s)+'</b>'+(i>0?'<small>'+Math.round(s/i*100)+'% de lo que ingresaste</small>':'')+'</div>';
 var h='';extra(ya,s);
 if(!M){h='<h2>Resumen mes a mes</h2><div class="mrow h"><span></span><span>Ingresos</span><span>Gastos</span><span>Ahorro</span></div>';
  for(var k=1;k<=12;k++){var a=ya.filter(function(x){return +x.date.slice(5,7)===k});var ii=sum(a,"in"),gg=sum(a,"out");
   h+='<div class="mrow"><span>'+MES[k-1].slice(0,3)+'</span><span class="in">'+Math.round(ii)+'</span><span class="out">'+Math.round(gg)+'</span><span class="sv">'+Math.round(ii-gg)+'</span></div>'}}
 $("yr").innerHTML=h;
 var cats={};ma.filter(function(x){return x.type==="out"}).forEach(function(x){cats[x.cat]=(cats[x.cat]||0)+x.amount});
 var ck=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]});
 $("yr").innerHTML+=donut(cats,ck,g);
 var l=ma.slice().sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:b.id-a.id});
 $("lt").textContent="Movimientos ("+l.length+")";
 $("list").innerHTML=l.length?l.map(function(x){return'<div class="row"><div><div>'+esc(x.cat)+'</div><div class="n">'+x.date.split("-").reverse().join("/")+(x.note?' · '+esc(x.note):'')+'</div></div><div><b class="'+x.type+'">'+(x.type==="in"?"+":"−")+eur(x.amount)+'</b><button data-d="'+x.id+'" aria-label="Borrar">🗑</button></div></div>'}).join(""):'<div class="empty">Aún no hay movimientos. Pulsa “+ Añadir”.</div>';
}
function cats(){$("ct").innerHTML=CAT[type].map(function(c){return'<option>'+esc(c)+'</option>'}).join("")+'<option value="__new">➕ Nueva categoría…</option>'}
function setT(t){type=t;$("t1").className=t==="in"?"a":"";$("t2").className=t==="out"?"a":"";cats()}
$("t1").onclick=function(){setT("in")};$("t2").onclick=function(){setT("out")};
$("add").onclick=function(){setT("in");$("am").value="";$("nt").value="";
 var d=new Date(),mm=M||d.getMonth()+1,dd=(Y===d.getFullYear()&&mm===d.getMonth()+1)?d.getDate():1;
 $("dt").value=Y+"-"+String(mm).padStart(2,"0")+"-"+String(dd).padStart(2,"0");$("sh").className="sheet on"};
$("cc").onclick=function(){$("sh").className="sheet"};
$("sv").onclick=function(){var a=parseFloat(String($("am").value).replace(",","."));if(!(a>0)||!$("dt").value){alert("Pon una cantidad y una fecha");return}
 tx.push({id:Date.now(),type:type,amount:a,cat:$("ct").value,date:$("dt").value,note:$("nt").value.trim()});save();
 Y=+$("dt").value.slice(0,4);if(M)M=+$("dt").value.slice(5,7);$("sh").className="sheet";fillSel();render()};
$("list").onclick=function(e){var d=e.target.getAttribute("data-d");if(d&&confirm("¿Borrar este movimiento?")){tx=tx.filter(function(x){return String(x.id)!==d});save();fillSel();render()}};
$("y").onchange=function(){Y=+this.value;render()};$("m").onchange=function(){M=+this.value;render()};
$("ex").onclick=function(){var b=new Blob([JSON.stringify({tx:tx,cat:CAT,goals:GO})],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="mis-finanzas.json";a.click()};
$("im").onclick=function(){$("fi").click()};
$("fi").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(Array.isArray(d))tx=d;else if(d&&d.tx){tx=d.tx;if(d.cat)CAT=d.cat;if(d.goals)GO=d.goals;sv2()}else return;save();fillSel();render()}catch(e){alert("Archivo no válido")}};r.readAsText(f)};
fillSel();render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
